name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Build & Package Script
        shell: pwsh
        run: |
          ./build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ChineseLocalization.zip
            dist/ChineseLocalization.dll
            dist/ChineseLocalizationHook.dll
            dist/OpenTabletDriver.UX.Wpf.exe
            dist/metadata.json
          generate_release_notes: true

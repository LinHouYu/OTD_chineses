name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Build & Package Script
        shell: pwsh
        run: |
          ./build.ps1

      - name: Determine Tag
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            echo "TAG=${{ inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "TAG=v1.0.0" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            dist/ChineseLocalization.zip
            dist/ChineseLocalization.dll
            dist/ChineseLocalizationHook.dll
            dist/OpenTabletDriver.UX.Wpf.exe
            dist/metadata.json
          generate_release_notes: true
          draft: false
          prerelease: false
